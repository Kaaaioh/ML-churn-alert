name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: |
          ruff check src tests
          ruff format --check src tests

      # Os testes treinam um modelo pequeno em pasta temporária, então rodam
      # sem o dataset e sem models/champion.joblib (ambos fora do git).
      - name: Testes (pytest)
        run: pytest -q
